name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK platform
        run: |
          sdkmanager "cmdline-tools;latest"
          "$ANDROID_SDK_ROOT/cmdline-tools/latest-2/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0" --channel=3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Restore stable release signing key
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$RELEASE_KEYSTORE_BASE64"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/hyperos4-release.keystore"

      - name: Build debug and release APKs
        env:
          RELEASE_STORE_FILE: ${{ runner.temp }}/hyperos4-release.keystore
          RELEASE_SIGNING_PASSWORD: ${{ secrets.RELEASE_SIGNING_PASSWORD }}
          MIUIX_MAVEN_USER: ${{ github.actor }}
          MIUIX_MAVEN_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gradle --no-daemon clean assembleDebug assembleRelease lintRelease

      - name: Collect APKs
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/HyperOS4NotificationImportance-debug.apk
          cp app/build/outputs/apk/release/app-release.apk artifacts/HyperOS4NotificationImportance-release.apk

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: HyperOS4NotificationImportance-APKs
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish stable download links
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v1.2.1 >/dev/null 2>&1 || gh release create v1.2.1 --title "v1.2.1" --notes "首页更新为仪表盘布局：激活卡会根据 LSPosed 服务与两个作用域状态实时切换绿/黄/红配色，并集中显示 Android、模块、LSPosed 与 Root 重启信息。保留 API 102、固定签名及“中”显示图标、“低”隐藏图标的修复，可直接覆盖安装 v1.2.0。"
          gh release upload v1.2.1 artifacts/*.apk --clobber
