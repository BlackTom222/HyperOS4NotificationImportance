name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Restore stable release signing key
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$RELEASE_KEYSTORE_BASE64"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/hyperos4-release.keystore"

      - name: Build debug and release APKs
        env:
          RELEASE_STORE_FILE: ${{ runner.temp }}/hyperos4-release.keystore
          RELEASE_SIGNING_PASSWORD: ${{ secrets.RELEASE_SIGNING_PASSWORD }}
        run: gradle --no-daemon clean assembleDebug assembleRelease lintRelease

      - name: Collect APKs
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/HyperOS4NotificationImportance-debug.apk
          cp app/build/outputs/apk/release/app-release.apk artifacts/HyperOS4NotificationImportance-release.apk

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: HyperOS4NotificationImportance-APKs
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish stable download links
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v1.1.0 >/dev/null 2>&1 || gh release create v1.1.0 --title "v1.1.0" --notes "迁移至现代 libxposed API 102，新增模块激活/作用域状态显示和 Root 一键重启作用域。修复‘中’重要性通知因静默策略被误隐藏的问题：现在仅过滤最终 Ranking 为 LOW(2) 或 MIN(1) 的状态栏图标。包名与固定签名保持不变，可直接覆盖安装 v1.0.6。"
          gh release upload v1.1.0 artifacts/*.apk --clobber
