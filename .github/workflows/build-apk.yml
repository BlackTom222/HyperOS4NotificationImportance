name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Restore stable release signing key
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$RELEASE_KEYSTORE_BASE64"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/hyperos4-release.keystore"

      - name: Build debug and release APKs
        env:
          RELEASE_STORE_FILE: ${{ runner.temp }}/hyperos4-release.keystore
          RELEASE_SIGNING_PASSWORD: ${{ secrets.RELEASE_SIGNING_PASSWORD }}
        run: gradle --no-daemon clean assembleDebug assembleRelease lintRelease

      - name: Collect APKs
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/HyperOS4NotificationImportance-debug.apk
          cp app/build/outputs/apk/release/app-release.apk artifacts/HyperOS4NotificationImportance-release.apk

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: HyperOS4NotificationImportance-APKs
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish stable download links
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v1.0.6 >/dev/null 2>&1 || gh release create v1.0.6 --title "v1.0.6" --notes "重写 HyperOS 4 状态栏通知图标过滤：参考 HyperCeiler 与 Pengeek/customiuizer，改在 NotificationIconsInteractor / StackCoordinator 管线中按最终通知 Ranking 过滤 LOW/MIN 图标，不再操作 StatusBarIconView，也不再把‘低’强制写成‘最低’。已有设置为‘低’的渠道无需重新选择。可直接覆盖安装 v1.0.5；安装后请确认 LSPosed 作用域包含‘设置’和‘系统界面’，然后重启手机。"
          gh release upload v1.0.6 artifacts/*.apk --clobber
