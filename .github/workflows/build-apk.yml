name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug and release APKs
        run: gradle --no-daemon clean assembleDebug assembleRelease lintRelease

      - name: Collect APKs
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/HyperOS4NotificationImportance-debug.apk
          cp app/build/outputs/apk/release/app-release.apk artifacts/HyperOS4NotificationImportance-release.apk

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: HyperOS4NotificationImportance-APKs
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish stable download links
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v1.0.0 >/dev/null 2>&1 || gh release create v1.0.0 --title "v1.0.0" --notes "HyperOS 4 通知重要性恢复模块首次发布。"
          gh release upload v1.0.0 artifacts/*.apk --clobber
