name: Apply MIUIX v1.2.0 sources

on:
  push:
    branches: [miuix-ui-v120]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: miuix-ui-v120
      - name: Apply sources
        shell: bash
        run: |
          printf '%s' '' | base64 --decode | tar -xJ
          git restore .github/workflows/build-apk.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Apply MIUIX interface for v1.2.0'
          git push origin HEAD:miuix-ui-v120
