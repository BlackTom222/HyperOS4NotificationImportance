pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        maven {
            url = uri('https://maven.pkg.github.com/ReChronoRain/HyperCeiler')
            credentials {
                username = System.getenv('MIUIX_MAVEN_USER') ?: 'github-actions'
                password = System.getenv('MIUIX_MAVEN_TOKEN') ?: ''
            }
        }
    }
}

rootProject.name = "HyperOS4NotificationImportance"
include(":app")
